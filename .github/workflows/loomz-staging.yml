name: LOOMZ Staging Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loomz-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate static catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python scripts/validate_static_release.py dist
      - name: Record validated commit
        run: echo "validated_sha=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  live-smoke:
    name: Check Hostinger staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://lightyellow-kudu-983160.hostingersite.com
    steps:
      - name: Wait for the new homepage
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/loomz-home.html -w '%{http_code}' "$SITE_URL/" || true)"
            if [ "$code" = 200 ] && grep -q 'Cloth for the way' /tmp/loomz-home.html; then
              echo "New homepage visible after attempt $attempt"
              exit 0
            fi
            sleep 30
          done
          echo "New LOOMZ homepage did not appear on the specified Hostinger address" >&2
          exit 1
      - name: Verify routes and assets
        run: |
          set -euo pipefail
          for path in daily.html occasion.html tailoring.html cloth-guide.html inquiry.html products/lz-01.html products/lz-20.html site.css site.js assets/lz-01.webp assets/lz-20.webp; do
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$SITE_URL/$path")"
            echo "$path -> $code"
            test "$code" = 200
          done
          curl -L -fsS "$SITE_URL/daily.html" | grep -q 'Sahar Lawn'
          curl -L -fsS "$SITE_URL/products/lz-20.html" | grep -q 'Naqsh Jacquard'
          echo "live_staging=PASSED" >> "$GITHUB_STEP_SUMMARY"
